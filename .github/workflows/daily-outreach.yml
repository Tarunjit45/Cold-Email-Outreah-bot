name: Daily Outreach

on:
  schedule:
    - cron: "30 4 * * *"   # 10:00 AM IST daily (UTC 04:30)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  send-outreach:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit the updated log back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run outreach bot
        env:
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
        run: python main.py

      - name: Commit updated logs
        run: |
          git config user.name "outreach-bot"
          git config user.email "actions@github.com"
          git add sent_log.csv state.json
          git diff --cached --quiet || git commit -m "Update sent log [skip ci]"
          git push
